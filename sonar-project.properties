# SonarCloud / SonarQube project configuration.
#
# Scope is deliberately the two libraries this repo ships — backbone-go and
# backbone-python — not the examples/ apps. The examples are runnable
# reference material (already covered by their own test suites and READMEs),
# not the product under quality-gated development; including them would
# dilute the gate with code whose job is to demonstrate usage, not to be
# reused.
#
# Fill in your own org/key before first use — these are placeholders:
#   sonar.organization -> your SonarCloud organization slug
#   sonar.projectKey   -> <organization>_<repo> is SonarCloud's default
sonar.organization=freakjazz
sonar.projectKey=FreakJazz_backbone
sonar.projectName=backbone
sonar.host.url=https://sonarcloud.io

sonar.sources=backbone-go,backbone-python
sonar.tests=backbone-go/tests,backbone-python/tests
sonar.test.inclusions=**/*_test.go,**/test_*.py

sonar.exclusions=**/docs/**,**/*.egg-info/**,backbone-python/htmlcov/**
sonar.coverage.exclusions=**/tests/**,**/*_test.go,**/test_*.py,backbone-python/setup.py

# Coverage reports produced by the "backbone-go" and "backbone-python" CI
# jobs (see .github/workflows/ci.yml and .github/workflows/sonarcloud.yml).
sonar.go.coverage.reportPaths=backbone-go/coverage.out
sonar.python.coverage.reportPaths=backbone-python/coverage.xml
sonar.python.version=3.11,3.12

sonar.sourceEncoding=UTF-8
