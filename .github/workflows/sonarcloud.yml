name: SonarCloud

# Manual-trigger only — NOT run on every push/PR. SonarCloud's free tier is
# public-repos-only; a private repo needs a paid plan, which is exactly what
# this project is avoiding by using the free, self-hosted alternative
# instead: docker-compose.sonarqube.yml + scripts/run-sonar-local.* (see the
# root README's "Quality & CI" section). This workflow is kept, unused, for
# if that ever changes (repo goes public, or a paid plan gets added) — run
# it by hand from the Actions tab ("Run workflow") once it's actually set up
# (SonarCloud project + SONAR_TOKEN secret, see below); it costs nothing to
# leave in place while dormant.
#
# Requires (one-time setup, not done by this file):
#   - A SonarCloud project matching sonar-project.properties at the repo
#     root (sonar.organization / sonar.projectKey).
#   - A SONAR_TOKEN repository secret (Settings > Secrets and variables >
#     Actions) generated from SonarCloud > My Account > Security.
#
# Every run step is a single line (chained with && instead of a multi-line
# block scalar) for the same reason as ci.yml/publish.yml in this repo — see
# the comment in ci.yml.
on:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backbone-go/go.sum

      - name: Go test with coverage
        # `go test ./... -coverprofile=...` doesn't produce a coverage.out
        # here: backbone-go's tests live in external test packages under
        # tests/ (they exercise the library through its public API, not
        # from inside each package), so `./...` also matches every
        # production package directory, which has no _test.go files of its
        # own — go test never merges a coverage profile in that mixed shape.
        # Scoping the *test target* to ./tests/... while using -coverpkg=./...
        # to still instrument (and attribute coverage to) the production
        # packages is what actually produces a valid, non-empty profile —
        # verified locally (53.3% total, vs. a silently-missing file before).
        working-directory: backbone-go
        run: go test ./tests/... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backbone-python/pyproject.toml

      - name: Python test with coverage
        working-directory: backbone-python
        run: python -m pip install --upgrade pip && pip install -e ".[test]" && pytest tests/ --cov=backbone --cov-report=xml --cov-report=term-missing

      - name: SonarCloud Scan
        # Skips (green, not red) rather than failing when the one-time setup
        # this workflow depends on hasn't happened yet: a SonarCloud project
        # matching sonar-project.properties's organization/projectKey, and a
        # SONAR_TOKEN repo secret generated for it. Without this guard every
        # push/PR fails CI for a setup step no code change here can fix —
        # see the root README's "Quality & CI" section for the setup steps.
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud not configured
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: echo "::warning::Skipping SonarCloud scan - SONAR_TOKEN repo secret is not set. See the root README's Quality & CI section for one-time setup."
