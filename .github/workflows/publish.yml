name: Build & Attach Release Artifacts (backbone-python)

# Activacion: Solo cuando se crea un Release
#
# Every run step below is a single line on purpose (chained with &&
# instead of a multi-line block scalar) - this file has repeatedly had its
# "|" block-scalar indicators stripped by something in this editing
# environment, which silently concatenates a multi-line run: block into
# one broken command. A single-line run: needs no such indicator, so there
# is nothing left for that process to corrupt.
on:
  release:
    types: [published]

  # Para testing manual
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + validate only, no upload to the release)'
        required: false
        default: false
        type: boolean

# Permisos minimos necesarios para adjuntar assets a un Release
permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Validacion y construccion
  build-and-validate:
    name: Build & Validate Package
    runs-on: ubuntu-latest
    defaults:
      run:
        # backbone-python/ is the package root - pyproject.toml, tests/ and
        # the source all live there, not at the repo root. Every step in
        # the previous version of this workflow ran from the repo root
        # instead and failed before doing anything (no pyproject.toml to
        # find there).
        working-directory: backbone-python

    outputs:
      package-version: ${{ steps.version.outputs.version }}
      package-name: ${{ steps.version.outputs.name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backbone-python/pyproject.toml

      - name: Install Build Dependencies
        run: python -m pip install --upgrade pip && pip install build twine && pip install -e ".[test]"

      - name: Extract Package Version
        id: version
        run: python -c "import tomllib, os; d = tomllib.load(open('pyproject.toml', 'rb')); v = d['project']['version']; n = d['project']['name']; print('package', n, v); open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + v + chr(10) + 'name=' + n + chr(10))"

      - name: Validate Release Version
        if: github.event_name == 'release'
        run: RELEASE_TAG="${{ github.event.release.tag_name }}"; PACKAGE_VERSION="${{ steps.version.outputs.version }}"; NORMALIZED_TAG="${RELEASE_TAG#backbone-python/v}"; NORMALIZED_TAG="${NORMALIZED_TAG#v}"; echo "release tag=$RELEASE_TAG normalized=$NORMALIZED_TAG package version=$PACKAGE_VERSION"; if [ "$NORMALIZED_TAG" != "$PACKAGE_VERSION" ]; then echo "version mismatch tag=$NORMALIZED_TAG pyproject=$PACKAGE_VERSION"; exit 1; fi; echo "version validation passed"

      - name: Run Tests
        run: pytest tests/ -v

      - name: Build Package
        run: echo "building package ${{ steps.version.outputs.name }} v${{ steps.version.outputs.version }}" && python -m build && ls -la dist/

      - name: Validate Built Package
        run: twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          path: backbone-python/dist/
          retention-days: 90

  # Job 2: Adjuntar los artefactos construidos al Release de GitHub.
  #
  # The previous version of this job published to a PyPI-style index
  # hosted on GitHub Packages - that product doesn't exist. GitHub
  # Packages supports npm, Maven, NuGet, RubyGems, and container images
  # only; it has no generic Python/pip registry, so that step could never
  # have succeeded regardless of how the rest of the workflow was fixed.
  #
  # Attaching the wheel/sdist to the Release itself is a real, working
  # GitHub feature that needs no external registry or credentials beyond
  # the default GITHUB_TOKEN. It doesn't make "pip install backbone" work
  # on its own - the sanctioned install method stays a git+https pip
  # install (see the root README and the Medium article series) - but it
  # does give every release a downloadable, versioned artifact and a
  # build/test gate that must pass before the release is considered done.
  attach-release-assets:
    name: Attach Build Artifacts to Release
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.event_name == 'release'

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-distributions
          path: dist/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          append_body: true
          body: "\n---\n\n## Build artifacts\n\n**Package** `${{ needs.build-and-validate.outputs.package-name }}`\n**Version** `${{ needs.build-and-validate.outputs.package-version }}`\n\nWheel and source distribution are attached to this release for reference. The supported install command is still\n\n```bash\npip install \"backbone @ git+https://github.com/FreakJazz/backbone.git@${{ github.event.release.tag_name }}#subdirectory=backbone-python\"\n```\n"

  # Job 3: Manejo de fallos
  handle-failure:
    name: Handle Failure
    runs-on: ubuntu-latest
    needs: [build-and-validate, attach-release-assets]
    if: failure()

    steps:
      - name: Failure Notification
        run: echo "## Build Failed" >> $GITHUB_STEP_SUMMARY && echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY && echo "Common issues" >> $GITHUB_STEP_SUMMARY && echo "- Version mismatch between the release tag and backbone-python/pyproject.toml" >> $GITHUB_STEP_SUMMARY && echo "- Test failures" >> $GITHUB_STEP_SUMMARY && echo "- Package validation failures (twine check)" >> $GITHUB_STEP_SUMMARY
