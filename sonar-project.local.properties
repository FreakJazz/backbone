# Local, self-hosted SonarQube configuration — used by
# `docker-compose.sonarqube.yml`'s scanner service, NOT by CI.
#
# This intentionally differs from the CI-facing sonar-project.properties
# (which targets SonarCloud and scopes to backbone-go/backbone-python only):
#   - broader scope: also scans examples/go/clean-api-go and
#     examples/python/clean_api_python, since a local strict-mode run is
#     meant to catch everything, reference apps included, not just the
#     libraries under a public quality gate.
#   - strict, external linters wired in on top of Sonar's own rules —
#     golangci-lint (Go) and ruff/bandit/mypy (Python) — via each report-path
#     property below. Generate the reports first (scripts/run-sonar-local.*
#     does this), then run the scanner; it only *reads* the report files,
#     it doesn't invoke the linters itself.
#
# sonar.host.url / sonar.token are passed by the scanner service at runtime
# (SONAR_HOST_URL env var default in docker-compose.sonarqube.yml, and
# SONAR_TOKEN which you generate from your local SonarQube instance — see
# the "Local SonarQube (Docker)" section in the root README) rather than
# hardcoded here, so this file has no secrets and stays safe to commit.
sonar.projectKey=backbone-local
sonar.projectName=backbone (local, strict)

sonar.sources=backbone-go,backbone-python,examples/go/clean-api-go,examples/python/clean_api_python
sonar.tests=backbone-go/tests,backbone-python/tests,examples/go/clean-api-go/tests
sonar.test.inclusions=**/*_test.go,**/test_*.py

sonar.exclusions=**/docs/**,**/*.egg-info/**,backbone-python/htmlcov/**,examples/go/clean-api-go/docs/**
sonar.coverage.exclusions=**/tests/**,**/*_test.go,**/test_*.py,backbone-python/setup.py

# Coverage — one report per Go module (backbone-go and the example are
# separate modules, each needs its own `go test -coverprofile`) plus the
# Python library's coverage.xml. The Python example has no test suite of
# its own yet, so nothing to report there.
sonar.go.coverage.reportPaths=backbone-go/coverage.out,examples/go/clean-api-go/coverage.out
sonar.python.coverage.reportPaths=backbone-python/coverage.xml
sonar.python.version=3.11,3.12

# Strict external linters — see .golangci.yml (Go) and ruff.toml / bandit.yaml
# (Python) for the actual rule sets. These properties make SonarQube import
# each tool's own findings as issues on top of its built-in rules, so a
# violation shows up in the same dashboard/quality gate either way.
sonar.go.golangci-lint.reportPaths=backbone-go/golangci-lint-report.json,examples/go/clean-api-go/golangci-lint-report.json
sonar.python.ruff.reportPaths=ruff-report.json
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.mypy.reportPaths=mypy-report.txt

sonar.sourceEncoding=UTF-8
