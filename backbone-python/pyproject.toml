[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backbone"
version = "0.2.0"
description = "Clean Architecture Framework with Event-Driven Microservices for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "FreakJazz", email = "freakjazz@example.com"}
]
maintainers = [
    {name = "FreakJazz", email = "freakjazz@example.com"}
]

keywords = [
    "clean-architecture", 
    "hexagonal-architecture", 
    "event-driven", 
    "microservices", 
    "ddd", 
    "cqrs",
    "framework",
    "python"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.0.0",
    "aiofiles>=25.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0"
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0"
]

docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0"
]

[project.urls]
Homepage = "https://github.com/FreakJazz/backbone"
Documentation = "https://github.com/FreakJazz/backbone#readme"
Repository = "https://github.com/FreakJazz/backbone"
"Bug Reports" = "https://github.com/FreakJazz/backbone/issues"
"Source Code" = "https://github.com/FreakJazz/backbone"

[tool.setuptools]
package-dir = {"backbone" = ""}

# Explicit list instead of [tool.setuptools.packages.find]: find() computes
# dotted package names *relative to `where`*, so it has no way to apply the
# "backbone" -> "" package-dir remap above — it discovers "domain",
# "application", etc. as their own top-level packages and drops the
# "backbone" root entirely (it's never itself found, since packages.find()
# only reports subdirectories of `where`, not `where` itself). The result:
# `pip install` from GitHub built a wheel with top-level modules named
# "domain", "application", ... instead of "backbone.domain",
# "backbone.application", ... — every example in this repo imports the
# latter, so the installed package was silently unusable. Listing every
# package explicitly under the "backbone." prefix is what actually makes
# package-dir's remap take effect.
packages = [
    "backbone",
    "backbone.domain",
    "backbone.domain.exceptions",
    "backbone.domain.ports",
    "backbone.domain.repositories",
    "backbone.domain.specifications",
    "backbone.application",
    "backbone.application.event_handlers",
    "backbone.application.exceptions",
    "backbone.infrastructure",
    "backbone.infrastructure.configuration",
    "backbone.infrastructure.events",
    "backbone.infrastructure.exceptions",
    "backbone.infrastructure.logging",
    "backbone.infrastructure.messaging",
    "backbone.infrastructure.persistence",
    "backbone.infrastructure.persistence.adapters",
    "backbone.infrastructure.testing",
    "backbone.interfaces",
    "backbone.interfaces.exceptions",
    "backbone.interfaces.response_builders",
    "backbone.errors",
]

[tool.setuptools.package-data]
backbone = ["py.typed"]

# Herramientas de desarrollo
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["backbone"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=backbone",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["backbone"]
# Without this, coverage.py bakes the absolute path it ran from into
# coverage.xml's <source> element (e.g. "C:\Users\...\backbone-python" on a
# Windows host). Any consumer reading that file from a different absolute
# path — the SonarQube scanner container, mounted at /usr/src, or a CI
# runner's own workspace path — can't resolve most files back to their
# coverage data and silently drops their measurements. relative_files makes
# coverage.py record paths relative to the project root instead, so the
# report resolves the same way regardless of who reads it or from where.
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract"
]